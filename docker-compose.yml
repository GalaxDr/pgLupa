# Banco de dados da ferramenta (PostgreSQL 18), onde ficam as ocorrências coletadas.
# A porta 5433 evita conflito com um PostgreSQL já instalado na máquina (5432).
services:
  ferramenta:
    image: postgres:18
    container_name: sqm-ferramenta
    environment:
      POSTGRES_USER: ferramenta
      POSTGRES_PASSWORD: ferramenta
      POSTGRES_DB: ferramenta
    ports:
      - "5433:5432"
    volumes:
      - ferramenta-dados:/var/lib/postgresql

volumes:
  ferramenta-dados:
