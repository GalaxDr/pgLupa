# Ambiente dos testes do TC.
#   monitorado -> PostgreSQL 18 de exemplo, observado pela ferramenta: na primeira inicialização cria o
#                 banco "loja" (cerca de 1,6 milhão de linhas) e grava o log em testes/logs
#   pgbadger   -> pgBadger 13.3, usado como referência na comparação (docker compose run)
#
#   docker compose -f testes/docker-compose.yml up -d monitorado
#
# Mesmo nome de projeto da raiz, para reaproveitar o contêiner e os dados já criados.
name: slowquery-monitor
services:
  monitorado:
    image: postgres:18
    container_name: sqm-monitorado
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: loja
    ports:
      - "5434:5432"
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=on
      - -c
      - logging_collector=on
      - -c
      - log_destination=csvlog
      - -c
      - log_directory=/logs
      - -c
      - log_filename=postgresql-%a.log
      - -c
      - log_rotation_age=1d
      - -c
      - log_rotation_size=0
      - -c
      - log_truncate_on_rotation=on
      - -c
      - log_file_mode=0644
      - -c
      - log_min_duration_statement=100
      - -c
      - lc_messages=C
    volumes:
      - monitorado-dados:/var/lib/postgresql
      - ./logs:/logs
      - ./monitorado/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

  pgbadger:
    build: ./pgbadger
    profiles: ["ferramentas"]
    volumes:
      - ./resultados:/resultados

volumes:
  monitorado-dados:
