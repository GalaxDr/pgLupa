# Publicação do site (modo hospedado) em um servidor com Docker, por exemplo uma VPS da Oracle Cloud.
#   docker compose -f docker-compose.producao.yml --env-file .env.producao up -d --build
services:
  banco:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ferramenta
      POSTGRES_PASSWORD: ${SENHA_BANCO}
      POSTGRES_DB: ferramenta
    volumes:
      - banco-dados:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ferramenta"]
      interval: 5s
      retries: 30

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://ferramenta:${SENHA_BANCO}@banco:5432/ferramenta
      MODO: hospedado
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-1024}
      RETENCAO_ANALISE_HORAS: ${RETENCAO_ANALISE_HORAS:-72}
    volumes:
      - uploads:/data/uploads
    depends_on:
      banco:
        condition: service_healthy

  # proxy com HTTPS automático (Let's Encrypt)
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMINIO: ${DOMINIO}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-1024}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-dados:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  banco-dados:
  uploads:
  caddy-dados:
  caddy-config:
